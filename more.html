<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otoz Connect · More</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
  :root {
    --c-primary: #173559;
    --c-accent:  #2BA6FF;
    --c-text:    #1d1d1f;
    --c-text-muted:    #6e6e73;
    --c-text-subtle:   #86868b;
    --c-text-tertiary: #a1a1a6;
    --c-bg-app:      #f5f5f7;
    --c-divider:     #e8e8ed;
    --c-divider-soft:#f1f5f9;
    --c-success: #30c46d;
    --c-danger:  #ff3b30;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Inter', sans-serif;
    background: #e8e8ed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Device shell ── */
  .device {
    width: 380px;
    height: 800px;
    background: #1d1d1f;
    border-radius: 54px;
    padding: 11px;
    position: relative;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.08);
  }
  .home-indicator {
    position: absolute;
    bottom: 9px; left: 50%;
    transform: translateX(-50%);
    width: 140px; height: 5px;
    background: #1d1d1f;
    border-radius: 3px;
    opacity: 0.9;
    z-index: 100;
    pointer-events: none;
  }
  .screen-wrapper {
    width: 100%; height: 100%;
    background: var(--c-bg-app);
    border-radius: 43px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* ── Status bar ── */
  .status-bar {
    height: 64px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 32px 8px;
    font-size: 16px; font-weight: 600;
    color: var(--c-text);
    letter-spacing: -0.02em;
    flex-shrink: 0;
    background: #fff;
  }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  .status-icons svg { width: 16px; height: 16px; }

  /* ── Toast ── */
  .toast {
    position: absolute;
    top: -100px; left: 50%;
    transform: translateX(-50%);
    background: var(--c-text);
    color: #fff;
    padding: 12px 18px;
    border-radius: 14px;
    font-size: 13.5px; font-weight: 500;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    z-index: 1000;
    transition: top 0.4s cubic-bezier(0.32,0.72,0,1);
    white-space: nowrap;
  }
  .toast.show { top: 75px; }
  .toast .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-success); flex-shrink: 0; }

  /* ── Header ── */
  .more-header {
    background: #fff;
    padding: 10px 20px 12px;
    border-bottom: 1px solid var(--c-divider-soft);
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }
  .more-logo {
    height: 26px;
    width: auto;
    object-fit: contain;
  }

  /* ── Scroll area ── */
  .more-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 14px 16px 100px;
  }

  /* ── Profile card ── */
  .more-profile-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    border: 1px solid var(--c-divider);
    border-radius: 18px;
    padding: 14px 14px;
    margin-bottom: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .more-profile-card:active { transform: scale(0.98); }

  .more-avatar {
    width: 50px; height: 50px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--c-primary) 0%, #2a4a73 100%);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(23,53,89,0.3);
  }
  .more-avatar i { font-size: 24px; color: #fff; }
  .more-profile-info { flex: 1; min-width: 0; }
  .more-profile-name {
    font-size: 15px; font-weight: 700;
    color: var(--c-text); letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .more-profile-label {
    font-size: 11px; color: var(--c-text-subtle); font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.05em;
    margin-bottom: 2px;
  }
  .more-profile-email {
    font-size: 15px; color: var(--c-text); font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .more-profile-chev i { font-size: 16px; color: var(--c-text-tertiary); }

  /* ── Section label ── */
  .more-section-label {
    font-size: 11px; font-weight: 600;
    color: var(--c-text-subtle);
    letter-spacing: 0.07em;
    text-transform: uppercase;
    margin-bottom: 8px;
    padding-left: 4px;
  }

  /* ── Group card ── */
  .more-group {
    background: #fff;
    border: 1px solid var(--c-divider);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }

  /* ── Row ── */
  .more-row {
    width: 100%;
    display: flex; align-items: center; gap: 12px;
    padding: 13px 14px;
    background: none; border: none;
    cursor: pointer; font-family: inherit;
    text-align: left;
    transition: background 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .more-row:active { background: var(--c-bg-app); }

  .more-row-icon {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .more-row-icon i { font-size: 20px; color: var(--c-text); }

  .more-row-text {
    flex: 1;
    font-size: 15px; font-weight: 400;
    color: var(--c-text); letter-spacing: -0.005em;
  }
  .more-row-chev i { font-size: 15px; color: var(--c-text-tertiary); }

  .more-divider {
    height: 1px;
    background: var(--c-divider);
    margin-left: 52px;
  }

  /* logout row */
  .more-logout-text { color: var(--c-danger) !important; }
  .more-logout-icon i { color: var(--c-danger) !important; }

  /* ── Bottom nav ── */
  .bottom-nav {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 80px;
    background: #fff;
    border-top: 1px solid rgba(0,0,0,0.07);
    display: flex;
    align-items: flex-start;
    justify-content: space-around;
    padding: 10px 0 0;
    z-index: 40;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    gap: 4px; cursor: pointer;
    background: none; border: none;
    font-family: inherit; padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-icon {
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-icon svg { width: 24px; height: 24px; display: block; overflow: visible; }
  .nav-label {
    font-size: 10px; font-weight: 500;
    color: #a0a0ab; letter-spacing: 0.01em; line-height: 1;
  }
  .nav-item.active .nav-label { color: var(--c-primary); font-weight: 700; }
  .nav-item.active .nav-icon svg { color: var(--c-primary); }
  .nav-icon .icon-outline { display: block; color: #a0a0ab; }
  .nav-icon .icon-filled  { display: none;  color: var(--c-primary); }
  .nav-item.active .nav-icon .icon-outline { display: none; }
  .nav-item.active .nav-icon .icon-filled  { display: block; }

</style>
</head>
<body>

<script>
  let _toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toast-text').textContent = msg;
    t.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  }
</script>

</body>
